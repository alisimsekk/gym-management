version: "3.8"

networks:
  gym-net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  mongo_data:
  activemq_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gym-management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym-management"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - gym-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  activemq:
    image: apache/activemq-classic:latest
    volumes:
      - activemq_data:/opt/apache-activemq/data
    networks:
      - gym-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  backend:
    image: gym-backend:${IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gym-management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/trainer_report?authSource=admin
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS_0: ${CORS_ORIGIN}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "60000"
    networks:
      - gym-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

  frontend:
    image: gym-frontend:${IMAGE_TAG}
    networks:
      - gym-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  nginx:
    image: gym-nginx:${IMAGE_TAG}
    ports:
      - "80:80"
    networks:
      - gym-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - node.role == manager
